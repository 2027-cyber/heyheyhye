
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Super Smash Flash 2</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="container"></div>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",

    splashScreen: false,
    showSwfDownload: false,

    allowScriptAccess: false,
    allowNetworking: "all",

    backgroundColor: "#000000",
    letterbox: "fullscreen",

    warnOnUnsupportedContent: true,
    contextMenu: "on",

    maxExecutionDuration: 120,

    logLevel: "error",
    quality: "high",
    scale: "showAll",

    allowFullscreen: true
};

window.addEventListener("load", async () => {

    try {
        const ruffle = window.RufflePlayer.newest();

        const player = ruffle.createPlayer();

        const container = document.getElementById("container");

        container.appendChild(player);

        player.style.width = "100%";
        player.style.height = "100%";

        await player.load({
            url: "https://2027-cyber.github.io/heyheyhye/super-smash-flash-2.swf"
        });

        console.log("Super Smash Flash 2 loaded!");

    } catch (error) {

        console.error("Ruffle loading error:", error);

        document.getElementById("container").innerHTML =
            '<div style="color:white;text-align:center;padding:20px;">' +
            'Game failed to load. Check the browser console for errors.' +
            '</div>';
    }

});
</script>

</body>
</html>
